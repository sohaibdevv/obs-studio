name: Finish OBS source upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finish-upload.yml

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message == 'Add finish upload workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the exact remaining source tree
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://github.com/obsproject/obs-studio/archive/220a16378fb9079b0ebd008ee994f5cb298de90d.tar.gz -o /tmp/obs.tar.gz
          mkdir -p /tmp/obs-source
          tar -xzf /tmp/obs.tar.gz -C /tmp/obs-source --strip-components=1
          for d in .github additional_install_files build-aux cmake deps docs frontend libobs libobs-d3d11 libobs-metal libobs-opengl libobs-winrt plugins shared test; do
            mkdir -p "$d"
            cp -rL "/tmp/obs-source/$d/." "$d/"
          done
          rm -f .github/workflows/finish-upload.yml
          find .github additional_install_files build-aux cmake deps docs frontend libobs libobs-d3d11 libobs-metal libobs-opengl libobs-winrt plugins shared test -type f -exec chmod 0644 {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .github additional_install_files build-aux cmake deps docs frontend libobs libobs-d3d11 libobs-metal libobs-opengl libobs-winrt plugins shared test
          git commit -m "Finish uploading OBS Studio source files"
          git push
