name: Preserve exact Windows file bytes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-raw-bytes.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add raw byte fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact raw blobs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > 'deps/w32-pthreads/pthread.sln'
          blob=$(git hash-object -w --no-filters 'deps/w32-pthreads/pthread.sln')
          git update-index --cacheinfo 100644 "$blob" 'deps/w32-pthreads/pthread.sln'
          printf '%s' '' | base64 -d > 'deps/w32-pthreads/pthread.vcxproj'
          blob=$(git hash-object -w --no-filters 'deps/w32-pthreads/pthread.vcxproj')
          git update-index --cacheinfo 100644 "$blob" 'deps/w32-pthreads/pthread.vcxproj'
          printf '%s' '' | base64 -d > 'deps/w32-pthreads/pthread.vcxproj.filters'
          blob=$(git hash-object -w --no-filters 'deps/w32-pthreads/pthread.vcxproj.filters')
          git update-index --cacheinfo 100644 "$blob" 'deps/w32-pthreads/pthread.vcxproj.filters'
          rm -f .github/workflows/fix-raw-bytes.yml
          git add -f .github/workflows/fix-raw-bytes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Preserve exact local bytes for Windows project files"
          git push

